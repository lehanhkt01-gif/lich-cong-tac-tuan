services:
  lich-congtac-web:
    build: .
    image: lich-congtac-app:latest
    container_name: lich-congtac-web
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=80
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:80/api/status\")' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
