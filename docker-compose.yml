services:
  # 1. Cơ sở dữ liệu PostgreSQL 16 (Bảo mật - Chỉ hoạt động trong mạng nội bộ)
  db:
    image: postgres:16-alpine
    container_name: lich-congtac-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-easup_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-lich_congtac_easup}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Ứng dụng Backend Web & API Python (SQLAlchemy / REST / Export Word)
  web:
    build: .
    image: lich-congtac-app:latest
    container_name: lich-congtac-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PORT=5000
      - DATABASE_URL=postgresql://${DB_USER:-easup_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-lich_congtac_easup}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_FULLNAME=${ADMIN_FULLNAME:-Văn phòng Đảng ủy - HĐND - UBND - UBMTTQ xã Ea Súp}
      - ADMIN_USERS_CONFIG=${ADMIN_USERS_CONFIG}
    volumes:
      - ./:/app
      - ./data/uploads:/app/data/uploads
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal_net

  # 3. Nginx Reverse Proxy (Tiếp nhận tên miền lichcongtac.easupso.com tại cổng 80)
  nginx:
    image: nginx:alpine
    container_name: lich-congtac-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./data/uploads:/usr/share/nginx/html/data/uploads:ro
    depends_on:
      - web
    networks:
      - internal_net

  # 4. Dozzle - Trình xem log thời gian thực trực quan
  dozzle:
    image: amir20/dozzle:latest
    container_name: lich-congtac-dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8899}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal_net

volumes:
  postgres_data:
    name: lich_congtac_postgres_data

networks:
  internal_net:
    name: lich_congtac_internal_net
    driver: bridge
